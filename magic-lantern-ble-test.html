<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magic-Lantern BLE Test</title>
<style>
:root{
  color-scheme:dark;
  --bg:#090b10;
  --panel:#141824;
  --line:#2a3142;
  --text:#f4f7fb;
  --muted:#9aa5b5;
  --accent:#7ce7ff;
  --danger:#ff667a;
  --ok:#74f0a7;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 10%,rgba(0,190,255,.14),transparent 34%),
    radial-gradient(circle at 80% 20%,rgba(255,0,180,.12),transparent 32%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Microsoft JhengHei",sans-serif;
}
.wrap{max-width:760px;margin:auto;padding:24px 16px 48px}
h1{font-size:28px;margin:0 0 8px}
.sub{color:var(--muted);margin-bottom:18px;line-height:1.5}
.card{
  background:rgba(20,24,36,.92);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 18px 50px rgba(0,0,0,.28);
}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{
  border:1px solid #35405a;
  background:#1a2130;
  color:#fff;
  border-radius:14px;
  min-height:48px;
  padding:0 16px;
  font-size:16px;
  font-weight:700;
}
button:active{transform:scale(.98)}
.primary{background:linear-gradient(135deg,#2762ff,#00b6ff);border:none}
.danger{background:#40202a;border-color:#6c2c3b}
.good{background:#153424;border-color:#285c40}
.status{
  display:flex;align-items:center;gap:9px;
  padding:11px 13px;border-radius:13px;
  background:#0e131d;border:1px solid var(--line);
}
.dot{width:10px;height:10px;border-radius:50%;background:#687386}
.dot.on{background:var(--ok);box-shadow:0 0 14px rgba(116,240,167,.7)}
label{display:block;margin:10px 0 7px;font-weight:700}
input[type="color"]{width:100%;height:72px;border:0;border-radius:16px;background:none;padding:0}
input[type="range"]{width:100%}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.colorBtn{height:56px;border-radius:14px;border:1px solid rgba(255,255,255,.18)}
.log{
  height:220px;overflow:auto;white-space:pre-wrap;
  background:#07090d;border:1px solid #222a38;border-radius:14px;
  padding:12px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:#c8d2e2
}
.small{font-size:13px;color:var(--muted);line-height:1.5}
.badge{
  display:inline-block;padding:5px 9px;border-radius:999px;
  background:#0f2030;border:1px solid #244866;color:#9addff;font-size:12px
}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Magic-Lantern BLE Test</h1>
  <div class="sub">測試 ELK / Magic-Lantern 常見的 FFF0 / FFF3 BLE 控制協議。</div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div class="status">
        <span id="dot" class="dot"></span>
        <span id="status">未連線</span>
      </div>
      <span class="badge">FFF0 → FFF3</span>
    </div>

    <div class="row" style="margin-top:14px">
      <button class="primary" id="connectBtn">連接氣氛燈</button>
      <button id="disconnectBtn">中斷連線</button>
    </div>

    <p class="small">
      iPhone Safari 通常不能直接使用 Web Bluetooth。請用支援 Web Bluetooth 的 iOS 瀏覽器（例如 Bluefy）打開此頁。
      連線前先完全關閉 Magic-Lantern App，避免控制器被原 App 佔用。
    </p>
  </div>

  <div class="card">
    <h3>基本測試</h3>
    <div class="row">
      <button class="good" id="onBtn">開燈</button>
      <button class="danger" id="offBtn">關燈</button>
    </div>

    <label>顏色</label>
    <input id="color" type="color" value="#ff0066">

    <div class="grid" style="margin-top:12px">
      <button class="colorBtn" data-rgb="255,0,0" style="background:#ff3030">紅</button>
      <button class="colorBtn" data-rgb="0,255,0" style="background:#18d96b">綠</button>
      <button class="colorBtn" data-rgb="0,80,255" style="background:#176cff">藍</button>
      <button class="colorBtn" data-rgb="255,255,255" style="background:#efefef;color:#111">白</button>
    </div>

    <label>亮度：<span id="brightnessText">100</span>%</label>
    <input id="brightness" type="range" min="1" max="100" value="100">
  </div>

  <div class="card">
    <h3>自訂動畫測試</h3>
    <label>速度：<span id="speedText">500</span> ms</label>
    <input id="speed" type="range" min="100" max="2000" step="50" value="500">
    <div class="row" style="margin-top:12px">
      <button id="pulseBtn">紅色脈衝</button>
      <button id="gradientBtn">紫藍漸變</button>
      <button id="rainbowBtn">彩虹循環</button>
      <button id="stopAnimBtn">停止動畫</button>
    </div>
    <p class="small">這些動畫是由網頁持續送 RGB 指令測試，不依賴 Magic-Lantern App 內建模式。</p>
  </div>

  <div class="card">
    <h3>通訊紀錄</h3>
    <div id="log" class="log"></div>
  </div>
</div>

<script>
const SERVICE_UUID = '0000fff0-0000-1000-8000-00805f9b34fb';
const WRITE_UUID   = '0000fff3-0000-1000-8000-00805f9b34fb';

let device = null;
let characteristic = null;
let animTimer = null;
let animStep = 0;

const logBox = document.getElementById('log');
const statusEl = document.getElementById('status');
const dot = document.getElementById('dot');

function log(msg){
  const t = new Date().toLocaleTimeString();
  logBox.textContent += `[${t}] ${msg}\n`;
  logBox.scrollTop = logBox.scrollHeight;
}
function setStatus(text, online=false){
  statusEl.textContent = text;
  dot.classList.toggle('on', online);
}
function hex(bytes){
  return [...bytes].map(v=>v.toString(16).padStart(2,'0').toUpperCase()).join(' ');
}
async function send(bytes){
  if(!characteristic) throw new Error('尚未連線');
  const data = Uint8Array.from(bytes);
  if (characteristic.properties.writeWithoutResponse && characteristic.writeValueWithoutResponse) {
    await characteristic.writeValueWithoutResponse(data);
  } else {
    await characteristic.writeValue(data);
  }
  log('TX  ' + hex(data));
}
function onDisconnect(){
  characteristic = null;
  setStatus('已中斷', false);
  stopAnimation();
  log('BLE 已中斷');
}

async function connect(){
  try{
    if(!navigator.bluetooth){
      throw new Error('此瀏覽器不支援 Web Bluetooth。iPhone 請改用 Bluefy 等支援 BLE 的瀏覽器。');
    }

    log('開始掃描 BLE 裝置…');

    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [SERVICE_UUID]
    });

    device.addEventListener('gattserverdisconnected', onDisconnect);
    setStatus(`連線中：${device.name || '未命名裝置'}`);
    log(`選擇裝置：${device.name || '(無名稱)'}`);

    const server = await device.gatt.connect();
    log('GATT 已連線');

    const service = await server.getPrimaryService(SERVICE_UUID);
    log('找到 Service FFF0');

    characteristic = await service.getCharacteristic(WRITE_UUID);
    log(`找到 Characteristic FFF3，write=${characteristic.properties.write}, writeWithoutResponse=${characteristic.properties.writeWithoutResponse}`);

    setStatus(`已連線：${device.name || 'BLE Device'}`, true);
    log('連線成功，可以開始測試。');
  }catch(err){
    console.error(err);
    setStatus('連線失敗', false);
    log('ERROR: ' + err.message);
  }
}

function disconnect(){
  if(device?.gatt?.connected) device.gatt.disconnect();
  characteristic = null;
  setStatus('未連線', false);
  stopAnimation();
}

function rgbCommand(r,g,b){
  // ELK / Magic-Lantern 常見 9-byte RGB 指令
  return [0x7E,0x07,0x05,0x03,r,g,b,0x10,0xEF];
}
function brightnessCommand(percent){
  // 常見 ELK 亮度指令：XX = 0~100
  return [0x7E,0x04,0x01,percent,0x01,0xFF,0xFF,0x00,0xEF];
}
function powerCommand(on){
  return on
    ? [0x7E,0x04,0x04,0xF0,0x00,0x01,0xFF,0x00,0xEF]
    : [0x7E,0x04,0x04,0x00,0x00,0x00,0xFF,0x00,0xEF];
}
function hexToRgb(h){
  return [
    parseInt(h.slice(1,3),16),
    parseInt(h.slice(3,5),16),
    parseInt(h.slice(5,7),16)
  ];
}

document.getElementById('connectBtn').onclick = connect;
document.getElementById('disconnectBtn').onclick = disconnect;
document.getElementById('onBtn').onclick = ()=>send(powerCommand(true)).catch(e=>log('ERROR: '+e.message));
document.getElementById('offBtn').onclick = ()=>send(powerCommand(false)).catch(e=>log('ERROR: '+e.message));

document.querySelectorAll('[data-rgb]').forEach(btn=>{
  btn.onclick = ()=>{
    const [r,g,b] = btn.dataset.rgb.split(',').map(Number);
    send(rgbCommand(r,g,b)).catch(e=>log('ERROR: '+e.message));
  }
});

document.getElementById('color').oninput = e=>{
  const [r,g,b] = hexToRgb(e.target.value);
  send(rgbCommand(r,g,b)).catch(err=>log('ERROR: '+err.message));
};

const bright = document.getElementById('brightness');
bright.oninput = ()=>{
  document.getElementById('brightnessText').textContent = bright.value;
};
bright.onchange = ()=>{
  send(brightnessCommand(Number(bright.value))).catch(e=>log('ERROR: '+e.message));
};

const speed = document.getElementById('speed');
speed.oninput = ()=>document.getElementById('speedText').textContent = speed.value;

function stopAnimation(){
  if(animTimer) clearInterval(animTimer);
  animTimer = null;
  animStep = 0;
}
function startAnimation(fn){
  stopAnimation();
  fn();
  animTimer = setInterval(fn, Number(speed.value));
}

document.getElementById('stopAnimBtn').onclick = stopAnimation;

document.getElementById('pulseBtn').onclick = ()=>{
  startAnimation(()=>{
    const values = [20,60,120,200,255,200,120,60];
    const r = values[animStep % values.length];
    animStep++;
    send(rgbCommand(r,0,0)).catch(e=>{log('ERROR: '+e.message);stopAnimation()});
  });
};

document.getElementById('gradientBtn').onclick = ()=>{
  startAnimation(()=>{
    const colors = [
      [170,0,255],[120,0,255],[70,0,255],[20,40,255],
      [0,100,255],[0,170,255],[20,80,255],[100,0,255]
    ];
    const c = colors[animStep % colors.length];
    animStep++;
    send(rgbCommand(...c)).catch(e=>{log('ERROR: '+e.message);stopAnimation()});
  });
};

document.getElementById('rainbowBtn').onclick = ()=>{
  startAnimation(()=>{
    const h = (animStep++ * 24) % 360;
    const s = 1, v = 1;
    const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
    let rp=0,gp=0,bp=0;
    if(h<60)[rp,gp,bp]=[c,x,0];
    else if(h<120)[rp,gp,bp]=[x,c,0];
    else if(h<180)[rp,gp,bp]=[0,c,x];
    else if(h<240)[rp,gp,bp]=[0,x,c];
    else if(h<300)[rp,gp,bp]=[x,0,c];
    else [rp,gp,bp]=[c,0,x];
    send(rgbCommand(
      Math.round((rp+m)*255),
      Math.round((gp+m)*255),
      Math.round((bp+m)*255)
    )).catch(e=>{log('ERROR: '+e.message);stopAnimation()});
  });
};

log('頁面已載入。先按「連接氣氛燈」。');
</script>
</body>
</html>
