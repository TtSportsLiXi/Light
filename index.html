<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<title>Sentra Ambient BLE</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080b12; --panel:#121826; --line:#2b3548;
  --text:#f5f7fb; --muted:#9ba7b8; --ok:#66e39b; --danger:#ff6b7c;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Microsoft JhengHei",sans-serif;
  background:
    radial-gradient(circle at 15% 0%,rgba(0,190,255,.16),transparent 30%),
    radial-gradient(circle at 85% 10%,rgba(150,70,255,.14),transparent 34%),
    var(--bg);
}
.wrap{max-width:760px;margin:auto;padding:22px 14px 50px}
h1{margin:0 0 6px;font-size:28px}
.sub{color:var(--muted);line-height:1.55;margin-bottom:16px}
.card{
  background:rgba(18,24,38,.94);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 18px 50px rgba(0,0,0,.28);
}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.status{
  display:flex;gap:9px;align-items:center;
  padding:10px 12px;border-radius:13px;
  border:1px solid var(--line);background:#0b1018;
}
.dot{width:10px;height:10px;border-radius:50%;background:#677286}
.dot.on{background:var(--ok);box-shadow:0 0 14px rgba(102,227,155,.75)}
button{
  min-height:48px;border-radius:14px;border:1px solid #36425d;
  background:#182131;color:#fff;padding:0 16px;font-size:16px;font-weight:750;
}
button:active{transform:scale(.98)}
.primary{border:none;background:linear-gradient(135deg,#2f63ff,#02b9ff)}
.danger{background:#3b1e28;border-color:#713245}
label{display:block;margin:13px 0 7px;font-weight:750}
input[type="color"]{width:100%;height:86px;border:0;border-radius:18px;background:none;padding:0}
input[type="range"]{width:100%}
.value{float:right;color:var(--muted);font-variant-numeric:tabular-nums}
.preview{
  height:120px;border-radius:20px;border:1px solid rgba(255,255,255,.12);
  margin:12px 0;display:flex;align-items:center;justify-content:center;
  font-weight:800;letter-spacing:.08em;text-shadow:0 2px 8px #000;
}
.small{font-size:13px;color:var(--muted);line-height:1.55}
.log{
  height:210px;overflow:auto;white-space:pre-wrap;
  border:1px solid #232c3a;background:#07090d;border-radius:14px;padding:11px;
  font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cbd5e4;
}
.pill{
  display:inline-block;padding:5px 9px;border-radius:999px;
  background:#0d1d2c;border:1px solid #284a66;color:#9ddcff;font-size:12px;
}
.note{
  margin-top:12px;padding:11px 12px;border-radius:14px;
  background:#0b1018;border:1px solid var(--line);color:var(--muted);
  font-size:13px;line-height:1.55;
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Sentra Ambient</h1>
  <div class="sub">Auto Connect V4：自動連線後直接開始呼吸，最低亮度固定 0%，並針對全滅區重新設計呼吸曲線。</div>

  <div class="card">
    <div class="row spread">
      <div class="status"><span id="dot" class="dot"></span><span id="status">初始化中…</span></div>
      <span class="pill">AUTO CONNECT + AUTO BREATH</span>
    </div>

    <div class="row" style="margin-top:12px">
      <button id="connectBtn" class="primary">首次授權 / 手動連線</button>
      <button id="disconnectBtn">中斷</button>
      <button id="onBtn">開燈</button>
      <button id="offBtn" class="danger">關燈</button>
    </div>

    <div class="note">
      連線成功後會自動開始呼吸，不需要再按「開始」。若 CarPlay 捷徑自動開啟 Bluefy 與此頁面，整個流程可自動完成。
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">絲滑呼吸燈</h3>

    <label>顏色</label>
    <input id="color" type="color" value="#8b5cff">
    <div id="preview" class="preview" style="background:#8b5cff">BREATHING PREVIEW</div>

    <label>呼吸週期 <span id="periodText" class="value">4.5 秒</span></label>
    <input id="period" type="range" min="2.5" max="8" step="0.1" value="4.5">

    <div class="note">
      最低亮度已固定為 <b>0%</b>。每次呼吸都會真正完全熄滅，並在全滅點短暫停留約 0.16 秒，讓「熄滅 → 再亮起」更自然。
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">通訊紀錄</h3>
    <div id="log" class="log"></div>
  </div>
</div>

<script>
const SERVICE_UUID='0000fff0-0000-1000-8000-00805f9b34fb';
const WRITE_UUID='0000fff3-0000-1000-8000-00805f9b34fb';

// Tuned defaults for this controller path:
// Bluefy -> Web Bluetooth -> ELK / Magic-Lantern controller
const SEND_INTERVAL_MS = 25;  // ~40 Hz: smoother without pushing BLE too hard
const OFF_HOLD_MS = 160;      // true blackout dwell around the bottom of each breath
const LOW_END_EXPONENT = 0.82;// lifts the first visible steps slightly to reduce low-end stair-stepping

let device=null, characteristic=null, reconnectTimer=null;
let manualDisconnect=false, connecting=false;

let breathing=false;
let rafId=null;
let breathStartTime=0;
let lastSendTime=0;
let writeBusy=false;

// Temporal error diffusion helps distribute fractional RGB levels across frames.
let quantErr={r:0,g:0,b:0};

const $=id=>document.getElementById(id);
const logBox=$('log');

function errText(e){
  if(e===undefined) return 'undefined';
  if(e===null) return 'null';
  if(typeof e==='string') return e;
  if(e?.message) return `${e.name||'Error'}: ${e.message}`;
  try{return JSON.stringify(e)}catch{return String(e)}
}
function log(msg){
  const t=new Date().toLocaleTimeString();
  logBox.textContent+=`[${t}] ${msg}\n`;
  logBox.scrollTop=logBox.scrollHeight;
}
function setStatus(text,online=false){
  $('status').textContent=text;
  $('dot').classList.toggle('on',online);
}
function bytesHex(bytes){
  return [...bytes].map(v=>v.toString(16).padStart(2,'0').toUpperCase()).join(' ');
}
async function send(bytes,silent=false){
  if(!characteristic) throw new Error('尚未連線');
  const data=Uint8Array.from(bytes);

  if(characteristic.properties.writeWithoutResponse && characteristic.writeValueWithoutResponse){
    await characteristic.writeValueWithoutResponse(data);
  }else{
    await characteristic.writeValue(data);
  }
  if(!silent) log('TX '+bytesHex(data));
}
function rgbCommand(r,g,b){return [0x7E,0x07,0x05,0x03,r,g,b,0x10,0xEF]}
function powerCommand(on){
  return on
    ? [0x7E,0x04,0x04,0xF0,0x00,0x01,0xFF,0x00,0xEF]
    : [0x7E,0x04,0x04,0x00,0x00,0x00,0xFF,0x00,0xEF];
}
function hexToRgb(hex){
  return {
    r:parseInt(hex.slice(1,3),16),
    g:parseInt(hex.slice(3,5),16),
    b:parseInt(hex.slice(5,7),16)
  };
}

function saveSettings(){
  localStorage.setItem('sentraAmbientSettingsV4',JSON.stringify({
    color:$('color').value,
    period:$('period').value
  }));
}
function loadSettings(){
  try{
    const s=JSON.parse(localStorage.getItem('sentraAmbientSettingsV4')||'null');
    if(!s) return;
    if(s.color) $('color').value=s.color;
    if(s.period) $('period').value=s.period;
  }catch{}
}

async function finishGattConnect(dev,source='自動'){
  if(connecting) return false;
  connecting=true;

  try{
    device=dev;
    manualDisconnect=false;

    device.removeEventListener?.('gattserverdisconnected',onDisconnected);
    device.addEventListener('gattserverdisconnected',onDisconnected);

    setStatus(`${source}連線中：${device.name||'BLE Device'}`);
    log(`${source} GATT connect：${device.name||'(無名稱)'}`);

    if(!device.gatt) throw new Error('BLE device 沒有 gatt');

    const server=device.gatt.connected ? device.gatt : await device.gatt.connect();
    const service=await server.getPrimaryService(SERVICE_UUID);
    characteristic=await service.getCharacteristic(WRITE_UUID);

    setStatus(`已連線：${device.name||'BLE Device'}`,true);
    log('成功：FFF0 / FFF3 已就緒');
    localStorage.setItem('sentraBLEDeviceId',device.id||'');

    // Small settle time before starting continuous writes.
    setTimeout(()=>{
      if(characteristic){
        log('連線完成，自動開始呼吸');
        startBreathing();
      }
    },300);

    return true;
  }catch(e){
    characteristic=null;
    setStatus('GATT 連線失敗',false);
    log('GATT ERROR: '+errText(e));
    return false;
  }finally{
    connecting=false;
  }
}

async function waitForAdvertisementAndConnect(dev){
  device=dev;
  setStatus(`等待 ${dev.name||'BLE'} 廣播…`,false);

  if(typeof dev.watchAdvertisements!=='function'){
    return await finishGattConnect(dev,'直接');
  }

  return await new Promise(async resolve=>{
    let done=false;

    const cleanup=()=>{
      clearTimeout(timeout);
      dev.removeEventListener?.('advertisementreceived',onAdv);
    };

    const onAdv=async event=>{
      if(done) return;
      done=true;
      cleanup();
      log(`收到 advertisement：${event.device?.name||dev.name||'BLE'} RSSI=${event.rssi ?? '?'}`);
      resolve(await finishGattConnect(dev,'自動'));
    };

    const timeout=setTimeout(async()=>{
      if(done) return;
      done=true;
      cleanup();
      log('8 秒內沒有 advertisement，改用直接連線');
      resolve(await finishGattConnect(dev,'Fallback'));
    },8000);

    try{
      dev.addEventListener('advertisementreceived',onAdv);
      await dev.watchAdvertisements();
      log('watchAdvertisements() 已啟動');
    }catch(e){
      if(done) return;
      done=true;
      cleanup();
      log('watchAdvertisements ERROR: '+errText(e));
      resolve(await finishGattConnect(dev,'Fallback'));
    }
  });
}

async function autoConnect(){
  if(!navigator.bluetooth){
    setStatus('此瀏覽器不支援 Web Bluetooth',false);
    return;
  }
  if(typeof navigator.bluetooth.getDevices!=='function'){
    setStatus('getDevices() 不可用，需手動連線',false);
    return;
  }

  try{
    setStatus('尋找已授權氣氛燈…',false);
    const devices=await navigator.bluetooth.getDevices();
    log(`已授權 BLE 裝置：${devices.length} 個`);

    if(!devices.length){
      setStatus('尚未授權裝置，請按「首次授權」',false);
      return;
    }

    const savedId=localStorage.getItem('sentraBLEDeviceId');
    let dev=null;

    if(savedId) dev=devices.find(d=>d.id===savedId);
    if(!dev) dev=devices.find(d=>(d.name||'').toUpperCase().includes('MELK'));
    if(!dev) dev=devices[0];

    log(`自動目標：${dev.name||'(無名稱)'}`);
    await waitForAdvertisementAndConnect(dev);
  }catch(e){
    setStatus('自動連線不可用',false);
    log('AUTO ERROR: '+errText(e));
  }
}

async function manualConnect(){
  try{
    if(!navigator.bluetooth) throw new Error('此瀏覽器不支援 Web Bluetooth，iPhone 請用 Bluefy。');

    const dev=await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:[SERVICE_UUID]
    });

    localStorage.setItem('sentraBLEDeviceId',dev.id||'');
    await finishGattConnect(dev,'手動');
  }catch(e){
    setStatus('手動連線失敗',false);
    log('MANUAL ERROR: '+errText(e));
  }
}

function onDisconnected(){
  stopBreathing(false);
  characteristic=null;
  setStatus('BLE 已中斷',false);
  log('BLE 已中斷');

  if(!manualDisconnect){
    clearTimeout(reconnectTimer);
    reconnectTimer=setTimeout(()=>{
      log('重新啟動自動連線流程…');
      autoConnect();
    },1500);
  }
}

function disconnect(){
  manualDisconnect=true;
  clearTimeout(reconnectTimer);
  stopBreathing(false);

  if(device?.gatt?.connected) device.gatt.disconnect();

  characteristic=null;
  setStatus('已手動中斷',false);
}

function updateUI(){
  $('periodText').textContent=`${Number($('period').value).toFixed(1)} 秒`;
  $('preview').style.background=$('color').value;
}

function quantizedChannel(value,key){
  const corrected=value+quantErr[key];
  const out=Math.max(0,Math.min(255,Math.round(corrected)));
  quantErr[key]=corrected-out;
  return out;
}

// Half-cosine with zero slope at both ends.
function raisedCosine01(x){
  return 0.5 - 0.5*Math.cos(Math.PI*x);
}

function breathingEnvelope(now){
  const periodMs=Number($('period').value)*1000;

  // Reserve true-off time at the start/end of each cycle.
  const activeMs=Math.max(500,periodMs-OFF_HOLD_MS);
  const t=(now-breathStartTime)%periodMs;

  const halfHold=OFF_HOLD_MS/2;
  if(t<halfHold || t>periodMs-halfHold){
    return 0;
  }

  const activeT=t-halfHold;
  const p=activeT/activeMs; // 0..1 through the active breathing section

  let envelope;
  if(p<=0.5){
    envelope=raisedCosine01(p*2);          // 0 -> 1
  }else{
    envelope=raisedCosine01((1-p)*2);      // 1 -> 0
  }

  // Slightly lifts the low end so the controller spends less time crawling
  // through obvious 0/1/2/3 RGB steps, while preserving a true zero plateau.
  return Math.pow(envelope,LOW_END_EXPONENT);
}

async function writeBreathFrame(now){
  if(writeBusy || !characteristic) return;

  const rgb=hexToRgb($('color').value);
  const intensity=breathingEnvelope(now);

  let r,g,b;

  if(intensity<=0){
    // Force exact zero during blackout; reset dithering residue.
    quantErr={r:0,g:0,b:0};
    r=g=b=0;
  }else{
    r=quantizedChannel(rgb.r*intensity,'r');
    g=quantizedChannel(rgb.g*intensity,'g');
    b=quantizedChannel(rgb.b*intensity,'b');
  }

  writeBusy=true;
  try{
    await send(rgbCommand(r,g,b),true);
  }catch(e){
    log('BREATH ERROR: '+errText(e));
    stopBreathing(false);
  }finally{
    writeBusy=false;
  }
}

function breathLoop(now){
  if(!breathing) return;

  if(now-lastSendTime>=SEND_INTERVAL_MS){
    lastSendTime=now;
    writeBreathFrame(now);
  }

  rafId=requestAnimationFrame(breathLoop);
}

function startBreathing(){
  if(!characteristic){
    log('ERROR: 尚未連線');
    return;
  }

  stopBreathing(false);

  breathing=true;
  quantErr={r:0,g:0,b:0};
  breathStartTime=performance.now();
  lastSendTime=0;

  log(`自動呼吸啟動：period=${$('period').value}s / off=0% / ${SEND_INTERVAL_MS}ms`);

  rafId=requestAnimationFrame(breathLoop);
}

function stopBreathing(logIt=true){
  breathing=false;

  if(rafId) cancelAnimationFrame(rafId);
  rafId=null;

  writeBusy=false;
  quantErr={r:0,g:0,b:0};

  if(logIt) log('呼吸已停止');
}

$('connectBtn').onclick=manualConnect;
$('disconnectBtn').onclick=disconnect;
$('onBtn').onclick=()=>send(powerCommand(true)).catch(e=>log('ERROR: '+errText(e)));
$('offBtn').onclick=()=>{
  stopBreathing(false);
  send(powerCommand(false)).catch(e=>log('ERROR: '+errText(e)));
};

$('period').addEventListener('input',()=>{
  updateUI();
  saveSettings();
});

$('color').addEventListener('input',()=>{
  updateUI();
  saveSettings();
});

loadSettings();
updateUI();

log('頁面載入，400 ms 後啟動自動連線 V4…');
setTimeout(autoConnect,400);
</script>
</body>
</html>
