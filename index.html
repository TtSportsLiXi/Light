<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<title>Sentra Ambient BLE</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#121826;--line:#2b3548;--text:#f5f7fb;--muted:#9ba7b8;--ok:#66e39b;--danger:#ff6b7c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Microsoft JhengHei",sans-serif;background:radial-gradient(circle at 15% 0%,rgba(0,190,255,.16),transparent 30%),radial-gradient(circle at 85% 10%,rgba(150,70,255,.14),transparent 34%),var(--bg)}
.wrap{max-width:760px;margin:auto;padding:22px 14px 50px}
h1{margin:0 0 6px;font-size:28px}.sub{color:var(--muted);line-height:1.55;margin-bottom:16px}
.card{background:rgba(18,24,38,.94);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.spread{justify-content:space-between}
.status{display:flex;gap:9px;align-items:center;padding:10px 12px;border-radius:13px;border:1px solid var(--line);background:#0b1018}
.dot{width:10px;height:10px;border-radius:50%;background:#677286}.dot.on{background:var(--ok);box-shadow:0 0 14px rgba(102,227,155,.75)}
button{min-height:48px;border-radius:14px;border:1px solid #36425d;background:#182131;color:#fff;padding:0 16px;font-size:16px;font-weight:750}
button:active{transform:scale(.98)}.primary{border:none;background:linear-gradient(135deg,#2f63ff,#02b9ff)}.danger{background:#3b1e28;border-color:#713245}
label{display:block;margin:13px 0 7px;font-weight:750}input[type="color"]{width:100%;height:86px;border:0;border-radius:18px;background:none;padding:0}input[type="range"]{width:100%}
.value{float:right;color:var(--muted);font-variant-numeric:tabular-nums}
.preview{height:120px;border-radius:20px;border:1px solid rgba(255,255,255,.12);margin:12px 0;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.08em;text-shadow:0 2px 8px #000}
.small{font-size:13px;color:var(--muted);line-height:1.55}.log{height:180px;overflow:auto;white-space:pre-wrap;border:1px solid #232c3a;background:#07090d;border-radius:14px;padding:11px;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cbd5e4}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#0d1d2c;border:1px solid #284a66;color:#9ddcff;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Sentra Ambient</h1>
  <div class="sub">Magic-Lantern / ELK BLE 控制器。已加入「曾授權裝置自動連線」。</div>

  <div class="card">
    <div class="row spread">
      <div class="status"><span id="dot" class="dot"></span><span id="status">初始化中…</span></div>
      <span class="pill">AUTO CONNECT</span>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="connectBtn" class="primary">首次授權 / 手動連線</button>
      <button id="disconnectBtn">中斷</button>
      <button id="onBtn">開燈</button>
      <button id="offBtn" class="danger">關燈</button>
    </div>
    <p class="small">
      第一次仍需手動選一次 BLE 裝置。Bluefy 記住授權後，之後捷徑開啟此頁會先用 Bluetooth.getDevices() 尋找已授權裝置並自動連線。
    </p>
  </div>

  <div class="card">
    <h3 style="margin-top:0">自訂呼吸燈</h3>
    <label>顏色</label>
    <input id="color" type="color" value="#8b5cff">
    <div id="preview" class="preview" style="background:#8b5cff">BREATHING PREVIEW</div>

    <label>呼吸週期 <span id="periodText" class="value">3.2 秒</span></label>
    <input id="period" type="range" min="1.5" max="8" step="0.1" value="3.2">

    <label>最低亮度 <span id="minText" class="value">3%</span></label>
    <input id="minBrightness" type="range" min="0" max="20" step="1" value="3">

    <label>Gamma <span id="gammaText" class="value">1.8</span></label>
    <input id="gamma" type="range" min="0.8" max="3" step="0.1" value="1.8">

    <label>更新間隔 <span id="intervalText" class="value">40 ms</span></label>
    <input id="interval" type="range" min="25" max="120" step="5" value="40">

    <div class="row" style="margin-top:16px">
      <button id="startBtn" class="primary">開始絲滑呼吸</button>
      <button id="stopBtn">停止呼吸</button>
      <button id="solidBtn">固定目前顏色</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">通訊紀錄</h3>
    <div id="log" class="log"></div>
  </div>
</div>

<script>
const SERVICE_UUID='0000fff0-0000-1000-8000-00805f9b34fb';
const WRITE_UUID='0000fff3-0000-1000-8000-00805f9b34fb';

let device=null, characteristic=null, breatheTimer=null, reconnectTimer=null;
let phase=0, lastTime=performance.now(), manualDisconnect=false;

const $=id=>document.getElementById(id);
const logBox=$('log');

function log(msg){
  const t=new Date().toLocaleTimeString();
  logBox.textContent+=`[${t}] ${msg}\n`;
  logBox.scrollTop=logBox.scrollHeight;
}
function setStatus(text,online=false){
  $('status').textContent=text;
  $('dot').classList.toggle('on',online);
}
function bytesHex(bytes){
  return [...bytes].map(v=>v.toString(16).padStart(2,'0').toUpperCase()).join(' ');
}
async function send(bytes,silent=false){
  if(!characteristic) throw new Error('尚未連線');
  const data=Uint8Array.from(bytes);
  if(characteristic.properties.writeWithoutResponse && characteristic.writeValueWithoutResponse){
    await characteristic.writeValueWithoutResponse(data);
  }else{
    await characteristic.writeValue(data);
  }
  if(!silent) log('TX '+bytesHex(data));
}
function rgbCommand(r,g,b){return [0x7E,0x07,0x05,0x03,r,g,b,0x10,0xEF]}
function powerCommand(on){
  return on?[0x7E,0x04,0x04,0xF0,0x00,0x01,0xFF,0x00,0xEF]:
            [0x7E,0x04,0x04,0x00,0x00,0x00,0xFF,0x00,0xEF];
}
function hexToRgb(hex){
  return {r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16)};
}

async function connectToDevice(dev, source='自動'){
  try{
    device=dev;
    manualDisconnect=false;
    device.removeEventListener?.('gattserverdisconnected',onDisconnected);
    device.addEventListener('gattserverdisconnected',onDisconnected);

    setStatus(`${source}連線中：${device.name||'BLE Device'}`);
    log(`${source}連線：${device.name||'(無名稱)'}`);

    const server=device.gatt.connected?device.gatt:await device.gatt.connect();
    const service=await server.getPrimaryService(SERVICE_UUID);
    characteristic=await service.getCharacteristic(WRITE_UUID);

    setStatus(`已連線：${device.name||'BLE Device'}`,true);
    log('連線成功，找到 FFF0 / FFF3');
    return true;
  }catch(e){
    characteristic=null;
    setStatus('自動連線失敗',false);
    log('AUTO ERROR: '+e.message);
    return false;
  }
}

async function autoConnect(){
  if(!navigator.bluetooth){
    setStatus('此瀏覽器不支援 Web Bluetooth',false);
    return;
  }

  if(typeof navigator.bluetooth.getDevices!=='function'){
    setStatus('Bluefy 此環境不支援自動取回裝置',false);
    log('Bluetooth.getDevices() 不可用，仍需按一次連接。');
    return;
  }

  try{
    setStatus('尋找已授權氣氛燈…',false);
    const devices=await navigator.bluetooth.getDevices();
    log(`已授權 BLE 裝置：${devices.length} 個`);

    if(!devices.length){
      setStatus('尚未授權裝置，請按「首次授權」',false);
      return;
    }

    // 優先使用上次成功連線的 device.id
    const savedId=localStorage.getItem('sentraBLEDeviceId');
    let candidates=devices;
    if(savedId){
      candidates=[...devices].sort((a,b)=>(a.id===savedId?-1:0)-(b.id===savedId?-1:0));
    }

    for(const dev of candidates){
      const ok=await connectToDevice(dev,'自動');
      if(ok){
        localStorage.setItem('sentraBLEDeviceId',dev.id);
        return;
      }
    }

    setStatus('找得到授權裝置，但目前無法連線',false);
  }catch(e){
    setStatus('自動連線不可用',false);
    log('getDevices ERROR: '+e.message);
  }
}

async function manualConnect(){
  try{
    if(!navigator.bluetooth) throw new Error('此瀏覽器不支援 Web Bluetooth，iPhone 請用 Bluefy。');
    const dev=await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:[SERVICE_UUID]
    });
    const ok=await connectToDevice(dev,'手動');
    if(ok) localStorage.setItem('sentraBLEDeviceId',dev.id);
  }catch(e){
    setStatus('連線失敗',false);
    log('ERROR: '+e.message);
  }
}

function onDisconnected(){
  stopBreathing();
  characteristic=null;
  setStatus('BLE 已中斷',false);
  log('BLE 已中斷');

  if(!manualDisconnect && device){
    clearTimeout(reconnectTimer);
    reconnectTimer=setTimeout(async()=>{
      log('嘗試自動重新連線…');
      const ok=await connectToDevice(device,'重新');
      if(!ok) autoConnect();
    },1200);
  }
}

function disconnect(){
  manualDisconnect=true;
  clearTimeout(reconnectTimer);
  stopBreathing();
  if(device?.gatt?.connected) device.gatt.disconnect();
  characteristic=null;
  setStatus('已手動中斷',false);
}

function updateLabels(){
  $('periodText').textContent=`${Number($('period').value).toFixed(1)} 秒`;
  $('minText').textContent=`${$('minBrightness').value}%`;
  $('gammaText').textContent=Number($('gamma').value).toFixed(1);
  $('intervalText').textContent=`${$('interval').value} ms`;
}
function updatePreview(){$('preview').style.background=$('color').value}
function stopBreathing(){
  if(breatheTimer) clearTimeout(breatheTimer);
  breatheTimer=null;phase=0;
}
function scheduleBreath(){breatheTimer=setTimeout(breathTick,Number($('interval').value))}
async function breathTick(){
  try{
    const now=performance.now(),dt=(now-lastTime)/1000;
    lastTime=now;
    const period=Number($('period').value);
    const minB=Number($('minBrightness').value)/100;
    const gamma=Number($('gamma').value);
    const rgb=hexToRgb($('color').value);

    phase+=(2*Math.PI*dt)/period;
    if(phase>=2*Math.PI) phase%=2*Math.PI;

    const smooth=(1-Math.cos(phase))/2;
    const corrected=Math.pow(smooth,gamma);
    const intensity=minB+(1-minB)*corrected;

    await send(rgbCommand(
      Math.round(rgb.r*intensity),
      Math.round(rgb.g*intensity),
      Math.round(rgb.b*intensity)
    ),true);

    scheduleBreath();
  }catch(e){
    log('BREATH ERROR: '+e.message);
    stopBreathing();
  }
}
function startBreathing(){
  if(!characteristic){log('ERROR: 尚未連線');return}
  stopBreathing();phase=0;lastTime=performance.now();
  log('開始絲滑呼吸');
  scheduleBreath();
}

$('connectBtn').onclick=manualConnect;
$('disconnectBtn').onclick=disconnect;
$('onBtn').onclick=()=>send(powerCommand(true)).catch(e=>log('ERROR: '+e.message));
$('offBtn').onclick=()=>send(powerCommand(false)).catch(e=>log('ERROR: '+e.message));
$('startBtn').onclick=startBreathing;
$('stopBtn').onclick=()=>{stopBreathing();log('呼吸已停止')};
$('solidBtn').onclick=()=>{
  stopBreathing();
  const {r,g,b}=hexToRgb($('color').value);
  send(rgbCommand(r,g,b)).catch(e=>log('ERROR: '+e.message));
};
['period','minBrightness','gamma','interval'].forEach(id=>$(id).addEventListener('input',updateLabels));
$('color').addEventListener('input',updatePreview);

updateLabels();
updatePreview();
log('頁面載入，嘗試自動連線已授權 BLE 裝置…');

// Give Bluefy a moment to initialize its Web Bluetooth bridge.
setTimeout(autoConnect,400);
</script>
</body>
</html>
